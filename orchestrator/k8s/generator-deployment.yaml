apiVersion: apps/v1
kind: Deployment
metadata:
  name: circle-generator
  namespace: circle
  labels:
    app: circle-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circle-generator
  template:
    metadata:
      labels:
        app: circle-generator
    spec:
      containers:
      - name: generator
        image: circle-generator:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: circle-secrets
            optional: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
