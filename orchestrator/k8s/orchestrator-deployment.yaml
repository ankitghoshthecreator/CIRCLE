# ==============================================================================
# CIRCLE Part 12: Orchestrator Deployment — Master Closed-Loop Controller
# Uses circle-orchestrator-sa ServiceAccount for RBAC-scoped cluster access.
# Mounts all 3 PVCs for full read/write access to pipeline artifacts.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circle-orchestrator
  namespace: circle
  labels:
    app: circle-orchestrator
    project: circle
    part: "12"
    tier: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circle-orchestrator
  template:
    metadata:
      labels:
        app: circle-orchestrator
        tier: orchestration
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60

      # ── Use the RBAC ServiceAccount for in-cluster API access ─────────────
      serviceAccountName: circle-orchestrator-sa

      containers:
        - name: orchestrator
          image: circle-orchestrator:v1.1
          imagePullPolicy: IfNotPresent

          # ── Environment ──────────────────────────────────────────────────
          envFrom:
            - configMapRef:
                name: circle-config
            - secretRef:
                name: circle-secrets
                optional: true
          env:
            # Internal DNS names for other CIRCLE services
            - name: TRAINER_SERVICE_URL
              value: "http://circle-trainer-svc:8080"
            - name: EVALUATOR_SERVICE_URL
              value: "http://circle-evaluator-svc:8081"
            - name: GENERATOR_SERVICE_URL
              value: "http://circle-generator-svc:8082"

          # ── Resource Requests & Limits ───────────────────────────────────
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          # ── Volume Mounts ─────────────────────────────────────────────────
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            - name: checkpoints-volume
              mountPath: /app/checkpoints
            - name: logs-volume
              mountPath: /app/logs

          # ── Health Probes ─────────────────────────────────────────────────
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          ports:
            - containerPort: 8083
              name: status
              protocol: TCP

      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: circle-data-pvc
        - name: checkpoints-volume
          persistentVolumeClaim:
            claimName: circle-checkpoints-pvc
        - name: logs-volume
          persistentVolumeClaim:
            claimName: circle-logs-pvc
