# ==============================================================================
# CIRCLE Part 12: Secrets — Sensitive API Keys & Credentials
#
# IMPORTANT: This file contains BASE64-ENCODED PLACEHOLDER VALUES only.
# Before deploying to a real cluster, replace placeholder values:
#
#   echo -n "your-real-groq-api-key" | base64
#
# Then paste the output as the value for GROQ_API_KEY below.
# Never commit real API keys to version control.
# For production, use an external secret manager (Vault, AWS Secrets Manager).
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: circle-secrets
  namespace: circle
  labels:
    project: circle
    part: "12"
  annotations:
    # Replace these placeholder values with real base64-encoded secrets before deploying.
    circle.ai/managed-by: "circle-orchestrator"
    circle.ai/rotate-interval: "90d"
type: Opaque
data:
  # base64("REPLACE_WITH_REAL_GROQ_API_KEY") — placeholder:
  GROQ_API_KEY: "UkVQTEFDRV9XSVRIX1JFQUxfR1JPUV9BUElfS0VZ"

  # base64("REPLACE_WITH_HF_TOKEN") — HuggingFace token for gated model downloads:
  HF_TOKEN: "UkVQTEFDRV9XSVRIX0hGX1RPS0VO"

  # base64("REPLACE_WITH_WANDB_API_KEY") — Weights & Biases experiment tracking:
  WANDB_API_KEY: "UkVQTEFDRV9XSVRIX1dBTkRCX0FQSV9LRVk="
