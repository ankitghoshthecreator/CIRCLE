# ==============================================================================
# CIRCLE Part 12: Trainer Service
# Exposes the trainer pod internally for health polling by the orchestrator.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: circle-trainer-svc
  namespace: circle
  labels:
    app: circle-trainer
    project: circle
    part: "12"
spec:
  selector:
    app: circle-trainer
  ports:
    - name: health
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
